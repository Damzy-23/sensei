name: CI

on:
  push:
    branches: [main, architecture-layout, ci-deploy]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on the deploy branch halfway through a deploy; later pushes queue.
  cancel-in-progress: ${{ github.ref != 'refs/heads/architecture-layout' }}

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    env:
      SENSEI_USE_STUBS: "1"
      SENSEI_DB_PATH: /tmp/sensei-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  image:
    name: Container builds and serves
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t senior .
      - name: Smoke test
        run: |
          docker run -d -p 8080:8080 --name senior senior
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q '<title>Senior</title>'
          curl -sf localhost:8080/favicon.svg >/dev/null
          curl -sf localhost:8080/tracks | grep -q blind_75

  deploy:
    name: Deploy (API to Cloud Run, site to Firebase Hosting)
    runs-on: ubuntu-latest
    needs: [image]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/architecture-layout' || github.event_name == 'workflow_dispatch')
    concurrency: deploy-production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: glo-ai-3e547
      REGION: europe-west2
      API_URL: https://senior-40946072816.europe-west2.run.app
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/40946072816/locations/global/workloadIdentityPools/senior-github/providers/github
          service_account: senior-deployer@glo-ai-3e547.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy the API
        run: gcloud run deploy senior --source . --region "$REGION" --project "$PROJECT" --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        working-directory: web
        run: npm ci && VITE_API_URL="$API_URL" npm run build
      - name: Deploy the site
        run: npx -y firebase-tools@14 deploy --only hosting:senior --project "$PROJECT" --non-interactive
      - name: Check it is up
        run: |
          curl -sf "$API_URL/health"
          curl -sf https://senior-coach-ai.web.app/ | grep -q '<title>Senior</title>'
